services:
  postgres:
    image: postgres:17.10-alpine3.23
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-networkops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-networkops}
      POSTGRES_DB: ${POSTGRES_DB:-networkops}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - networkops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.8.0-alpine3.23
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-networkops}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - networkops_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  networkops_postgres_data:
  networkops_redis_data:
